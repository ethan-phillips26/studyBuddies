@if (!profileComplete()) {
  <div class="sb-empty">
    <i class="bi bi-person-vcard"></i>
    <h1>Please fully complete your profile to access matching!</h1>
  </div>
} @else {
  @if (currentMatches()) {
    <div class="match-page">
      @for (id of [matches[currentUserIndex]]; track id) {
        <app-match-card
          [name]="firstname + ' ' + lastname"
          [imageUrl]="imageUrl"
          [initials]="initials"
          [bio]="bio"
          [strengths]="strengths"
          [weaknesses]="weaknesses"
          [freeTimes]="freeTimes"
          [classes]="cardClasses"
          (like)="like()"
          (skip)="dislike()"
        />
      }
      <div class="text-center mb-4">
        <button class="btn btn-link clear-link" (click)="clearMatch()">
          <i class="bi bi-arrow-counterclockwise"></i> Clear Match History
        </button>
      </div>
    </div>
  } @else {
    <div class="sb-empty">
      <i class="bi bi-people"></i>
      <h1>You have no new matches.</h1>
      <button class="btn btn-link clear-link" (click)="clearMatch()">
        <i class="bi bi-arrow-counterclockwise"></i> Clear Match History
      </button>
    </div>
  }
}
