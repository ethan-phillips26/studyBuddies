<nav class="navbar navbar-expand-lg navbar-dark green-bg main-font">
  <div class="container-fluid px-3 px-lg-4">

      <span class="brand-word"><span class="yellow-text">Study</span><span class="text-white">Buddies</span></span>

        data-bs-target="#navbarText"
        aria-controls="navbarText"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item">
            <a class="nav-pill" [routerLink]="link('')" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"
              ><i class="bi bi-hand-thumbs-up-fill"></i> Match</a>
          </li>
          <li class="nav-item">
            <a class="nav-pill" [routerLink]="link('group')" routerLinkActive="active" ariaCurrentWhenActive="page"

          </li>
          <li class="nav-item">
            <a class="nav-pill" [routerLink]="link('message')" routerLinkActive="active" ariaCurrentWhenActive="page"
              ><i class="bi bi-envelope-fill"></i> Message</a>
          </li>
          <li class="nav-item">
            <a class="nav-pill" [routerLink]="link('profile')" routerLinkActive="active" ariaCurrentWhenActive="page"
              ><i class="bi bi-person-circle"></i> Profile</a>
          </li>
          <li class="nav-item nav-sep" aria-hidden="true"></li>
