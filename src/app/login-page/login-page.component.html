<section class="login main-font">
  <div class="hero">
    <h1>
      <span class="welcome">Welcome to</span>
      <span class="wordmark"><span class="w-study">Study</span><span class="w-buddies">Buddies</span></span>
    </h1>
    <p class="lede">The social media platform built to help you succeed</p>

    <div class="login-actions">
      <button id="google-login" class="btn yellow-button btn-lg" (click)="signInWithGoogle()">
        <i class="bi bi-google"></i> Sign in with Google
      </button>
      <a routerLink="/demo" class="btn btn-lg demo-link">Just looking? Try the demo <i class="bi bi-arrow-right"></i></a>
    </div>
    <p class="hint"><i class="bi bi-info-circle"></i> Please sign in with a valid NDSU Google account</p>
  </div>
</section>
